name: Montaj muddati eslatmasi

on:
  # schedule: # OLIB TASHLANDI 2026-08-29 - cron-job.org'ga ko'chirildi (GitHub Actions kechikish muammosi)
  #   - cron: "27 * * * *"
  workflow_dispatch: {}

jobs:
  deadline-check:
    runs-on: ubuntu-latest
    steps:
      - name: Muddatlarni tekshirish
        run: |
          for i in 1 2 3; do
            if curl -sf --max-time 60 "https://kadr-media.onrender.com/api/cron/deadline-check"; then
              echo "Tekshirildi."
              exit 0
            fi
            echo "Urinish $i muvaffaqiyatsiz, qayta urinaman..."
            sleep 20
          done
          exit 1

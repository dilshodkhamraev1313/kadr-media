name: Loyiha harakatsizligi ogohlantirishi

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch: {}

jobs:
  inactive-projects:
    runs-on: ubuntu-latest
    steps:
      - name: Harakatsiz loyihalarni tekshirish
        run: |
          for i in 1 2 3; do
            if curl -sf --max-time 60 "https://kadr-media.onrender.com/api/cron/inactive-projects"; then
              echo "Tekshirildi."
              exit 0
            fi
            echo "Urinish $i muvaffaqiyatsiz, qayta urinaman..."
            sleep 20
          done
          exit 1
